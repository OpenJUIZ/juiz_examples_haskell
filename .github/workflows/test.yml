name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: &docs
      - "**.md"
      - "LICENSE*"
  pull_request:
    # draft の PR では動かさず、ready for review にしたときに動かす
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *docs
  workflow_dispatch:

# 同じブランチに続けて push したら、前の実行を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # README の手順で使う juiz の版 (タグ)。build.sh の JUIZ_GIT_REF と合わせる。
  # juiz コマンドと pyjuiz は同じ版 (先頭の v を除いたもの) を入れる
  JUIZ_GIT_REF: "v0.0.28"
  # GHC と cabal の版。入れた GHC をキャッシュするので、キャッシュのキーが変わらないよう細かく固定する
  GHC_VERSION: "9.6.7"
  CABAL_VERSION: "3.18.1.0"

jobs:
  examples:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # macos-latest は Xcode 26 に Command Line Tools 27 (MacOSX27.0.sdk) が入っていて、build.sh が
        # DEVELOPER_DIR を切り替えてリンクする (OpenJUIZ/juiz#143)。切り替えが要らない macos-15 でも確かめる
        os: [ubuntu-latest, macos-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # juiz コマンドは Python を組み込むので、ビルドに Python の開発用ファイルが要る。
      # patchelf は .juizapp に入れるプラグインと GHC の共有ライブラリの RUNPATH を書き換えるのに使う
      - name: ビルドに必要なものを入れる (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-dev patchelf
      # macOS の python3 は新しすぎて juiz コマンドの PyO3 が対応していないので、3.13 を使う
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      # 対応するのは GHC 9.6 以降で、その最小の系列で確かめる。
      # ghcup での GHC のインストールに Linux で約 2 分、macOS で約 4 分かかるので、入れた GHC をキャッシュする。
      # GHC の置き場所は ghcup と同じく ${GHCUP_INSTALL_BASE_PREFIX:-$HOME}/.ghcup/ghc/<版>
      - name: ghcup の置き場所を調べる
        id: ghcup
        shell: bash
        run: echo "dir=${GHCUP_INSTALL_BASE_PREFIX:-$HOME}/.ghcup" >> "$GITHUB_OUTPUT"
      - name: GHC のキャッシュを戻す
        id: ghc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.ghcup.outputs.dir }}/ghc/${{ env.GHC_VERSION }}
          key: ghc-${{ env.GHC_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      # キャッシュに GHC があれば、haskell-actions/setup はインストールを飛ばして ghcup set だけする
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          # cabal.project が参照する hsjuiz は build.sh が取得するので、ここでは cabal update しない
          # (Hackage の索引も使わない)
          cabal-update: false
      # サンプルのビルドが失敗しても次から使えるよう、インストールした直後に保存する
      - name: GHC をキャッシュに保存する
        if: steps.ghc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.ghcup.outputs.dir }}/ghc/${{ env.GHC_VERSION }}
          key: ${{ steps.ghc-cache.outputs.cache-primary-key }}
      - name: juiz コマンドのキャッシュ
        id: juiz-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/juiz
          key: juiz-app-${{ env.JUIZ_GIT_REF }}-${{ runner.os }}-${{ runner.arch }}
      - name: juiz コマンドをインストールする
        if: steps.juiz-cache.outputs.cache-hit != 'true'
        run: cargo install juiz_app --version "${JUIZ_GIT_REF#v}" --locked
      # データ型のサンプル (typed_pose.conf) の Python の Process が pyjuiz を使う
      - name: pyjuiz をインストールする
        run: python3 -m pip install --user --break-system-packages "pyjuiz==${JUIZ_GIT_REF#v}"
      - name: juiz-idl のビルド結果のキャッシュ
        uses: actions/cache@v4
        with:
          path: build/juiz_sdk
          key: juiz-sdk-${{ env.JUIZ_GIT_REF }}-${{ runner.os }}-${{ runner.arch }}
      - name: サンプルをビルドする
        run: ./build.sh
      - name: サンプルを動かして結果を確かめる
        run: python3 tests/test_examples.py
      # テストで作った .juizapp (packages/) を、タグのときに Releases に載せるため残す。
      # macos-15 は macos-latest と同じターゲット (aarch64-apple-darwin) なので残さない
      - uses: actions/upload-artifact@v4
        if: matrix.os != 'macos-15'
        with:
          name: juizapp-${{ matrix.os }}
          path: dist/*.juizapp
          if-no-files-found: error

  # v* のタグを付けたときは、各 OS で作った .juizapp を Releases に載せる
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [examples]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: juizapp-*
          path: dist
          merge-multiple: true
      - name: Releases に載せる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "サンプルのアプリの .juizapp (juiz ${GITHUB_REF_NAME#v} 用)"
          gh release upload "$GITHUB_REF_NAME" dist/*.juizapp --clobber
