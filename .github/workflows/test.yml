name: test

# このリポジトリは非公開なので、Actions の実行時間が無料枠から引かれる。
# macOS のランナーは Linux の 10 倍で数えられるため、macOS のジョブは main への push と
# 手動実行 (workflow_dispatch) のときだけ動かし、PR では Linux だけで確かめる。
# PR で macOS も確かめたいときは、PR のブランチを指定して手動実行する。
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - "LICENSE*"
  pull_request:
    # draft の PR では動かさず、ready for review にしたときに動かす
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *docs
  workflow_dispatch:

# 同じブランチに続けて push したら、前の実行を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # README の手順で使う juiz の版 (タグ)。build.sh の JUIZ_GIT_REF と合わせる。
  # juiz コマンドと pyjuiz は同じ版 (先頭の v を除いたもの) を入れる
  JUIZ_GIT_REF: "v0.0.25"

jobs:
  examples:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # macos-latest は Xcode 26 に Command Line Tools 27 (MacOSX27.0.sdk) が入っていて、build.sh が
        # DEVELOPER_DIR を切り替えてリンクする (OpenJUIZ/juiz#143)。切り替えが要らない macos-15 でも確かめる。
        # PR では ubuntu-latest だけ (上の on: の説明を参照)
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # juiz コマンドは Python を組み込むので、ビルドに Python の開発用ファイルが要る
      - name: ビルドに必要なものを入れる (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      # macOS の python3 は新しすぎて juiz コマンドの PyO3 が対応していないので、3.13 を使う
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      # 対応するのは GHC 9.6 以降
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: latest
          # cabal.project が参照する hsjuiz は build.sh が取得するので、ここでは cabal update しない
          # (Hackage の索引も使わない)
          cabal-update: false
      - name: juiz コマンドのキャッシュ
        id: juiz-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/juiz
          key: juiz-app-${{ env.JUIZ_GIT_REF }}-${{ runner.os }}-${{ runner.arch }}
      - name: juiz コマンドをインストールする
        if: steps.juiz-cache.outputs.cache-hit != 'true'
        run: cargo install juiz_app --version "${JUIZ_GIT_REF#v}" --locked
      # データ型のサンプル (typed_pose.conf) の Python の Process が pyjuiz を使う
      - name: pyjuiz をインストールする
        run: python3 -m pip install --user --break-system-packages "pyjuiz==${JUIZ_GIT_REF#v}"
      - name: libjuiz_sdk のビルド結果のキャッシュ
        uses: actions/cache@v4
        with:
          path: build/juiz_sdk
          key: juiz-sdk-${{ env.JUIZ_GIT_REF }}-${{ runner.os }}-${{ runner.arch }}
      - name: サンプルをビルドする
        run: ./build.sh
      - name: サンプルを動かして結果を確かめる
        run: python3 tests/test_examples.py
