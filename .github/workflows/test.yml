name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # 使う juiz の版 (タグかコミット)。build.sh の JUIZ_GIT_REF と合わせる。
  # データ型のサンプルは juiz の次の版 (0.0.23) で入る機能を使うので、公開までは juiz の main のコミットを使う。
  # 公開後はタグ (v0.0.23) に戻し、juiz コマンドも cargo install juiz_app --version で入れる
  JUIZ_GIT_REF: "43a2210c7affaf62f93dc48ad1fd53d77f326df2"

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest は Xcode 26 に Command Line Tools 27 (MacOSX27.0.sdk) が入っていて、build.sh が
        # DEVELOPER_DIR を切り替えてリンクする (OpenJUIZ/juiz#143)。切り替えが要らない macos-15 でも確かめる
        os: [ubuntu-latest, macos-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # juiz コマンドは Python を組み込むので、ビルドに Python の開発用ファイルが要る
      - name: ビルドに必要なものを入れる (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      # macOS の python3 は新しすぎて juiz コマンドの PyO3 が対応していないので、3.13 を使う
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      # 対応するのは GHC 9.6 以降
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: latest
          # cabal.project が参照する hsjuiz は build.sh が取得するので、ここでは cabal update しない
          # (Hackage の索引も使わない)
          cabal-update: false
      - name: juiz コマンドのキャッシュ
        id: juiz-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/juiz
          key: juiz-app-${{ env.JUIZ_GIT_REF }}-${{ runner.os }}-${{ runner.arch }}
      - name: juiz コマンドをインストールする
        if: steps.juiz-cache.outputs.cache-hit != 'true'
        run: cargo install juiz_app --git https://github.com/OpenJUIZ/juiz --rev "$JUIZ_GIT_REF" --locked
      # データ型のサンプル (typed_pose.conf) の Python の Process が pyjuiz を使う
      - name: pyjuiz をインストールする
        run: python3 -m pip install --user --break-system-packages "pyjuiz @ git+https://github.com/OpenJUIZ/juiz@${JUIZ_GIT_REF}#subdirectory=bindings/pyjuiz"
      - name: libjuiz_sdk のビルド結果のキャッシュ
        uses: actions/cache@v4
        with:
          path: build/juiz_sdk
          key: juiz-sdk-${{ env.JUIZ_GIT_REF }}-${{ runner.os }}-${{ runner.arch }}
      - name: サンプルをビルドする
        run: ./build.sh
      - name: サンプルを動かして結果を確かめる
        run: python3 tests/test_examples.py
