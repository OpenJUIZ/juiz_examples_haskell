name: typed_pose
# サンプル共通の型 (types/geometry.jidl) を使い、言語をまたいで型付きの値を受け渡す。
#   twist0 (Python、Twist2D を出す) --Pull--> move0 (Haskell) の引数 twist
#   move0 (Haskell、Pose2D を出す) --Push--> print0 (Python) の引数 pose
# 先に ./build.sh と juiz idl -g python -o gen types/geometry.jidl を済ませておく。
option:
  http_broker:
    start: true
    port: 8000
  # Python のプラグインの場所 (./python) から見た、Python の型 (gen/) の場所
  pythonpath: ["../gen"]
plugins:
  process_factories:
    pose_move_hs:
      language: "haskell"
      path: "./build/plugins"
    twist_python:
      language: python
      path: "./python"
    pose_print_python:
      language: python
      path: "./python"
processes:
  - type_name: twist_python
    name: twist0
  - type_name: pose_move_hs
    name: move0
  - type_name: pose_print_python
    name: print0
connections:
  - name: twist_to_move
    connection_type: Pull
    source:
      name: twist0
      type_name: twist_python
    destination:
      name: move0
      type_name: pose_move_hs
    arg_name: twist
  - name: move_to_print
    connection_type: Push
    source:
      name: move0
      type_name: pose_move_hs
    destination:
      name: print0
      type_name: pose_print_python
    arg_name: pose
