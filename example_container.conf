name: example_container
option:
  http_broker:
    start: true
    port: 8000
plugins:
  container_factories:
    example_container_hs:
      language: "haskell"
      path: "./build/plugins"
      processes:
        example_container_hs_increment:
          path: "./build/plugins"
        example_container_hs_get:
          path: "./build/plugins"
containers:
  - type_name: example_container_hs
    name: container0
    value: 10
    processes:
      - type_name: example_container_hs_increment
        name: increment0
      - type_name: example_container_hs_get
        name: get0
