name: talker_listener
option:
  http_broker:
    start: true
    port: 8000
plugins:
  process_factories:
    talker_hs:
      language: "haskell"
      path: "./build/plugins"
    listener_hs:
      language: "haskell"
      path: "./build/plugins"
processes:
  - type_name: talker_hs
    name: talker0
  - type_name: listener_hs
    name: listener0
connections:
  - name: con0
    connection_type: Push
    source:
      name: talker0
      type_name: talker_hs
    destination:
      name: listener0
      type_name: listener_hs
    arg_name: arg1
ecs:
  - name: ec0
    type_name: main_loop_ec
    rate: 1.0
    bind:
      - name: talker0
        type_name: talker_hs
    auto_start: true
